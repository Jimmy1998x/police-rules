<!DOCTYPE html>
<html lang="th">

<head>

    </section>

    <section id="loading">

        กำลังโหลดข้อมูล...

    </section>

    <section id="tables">

    </section>
        <footer class="footer">

        <p>
            ฐานข้อมูลคดีตำรวจ

        <p>
            ข้อมูลอัปเดตจาก Google Sheets แบบอัตโนมัติ
